<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indices · Fruit Ninja Vocabulary</title><style>*{box-sizing:border-box}body{margin:0;background:#15152b;color:white;font-family:Arial,"Microsoft YaHei",sans-serif;text-align:center}header{padding:18px;background:#242440;display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#ffe16c;font-weight:bold}h1{font-size:clamp(26px,5vw,42px);margin:18px 0 6px}.info{color:#d5d2f5}button,select,input{font:inherit;font-size:18px;border-radius:12px;padding:11px 15px;border:2px solid #fff}button{cursor:pointer;background:#ffdc55;color:#222;font-weight:bold}.setup{margin:20px auto;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}.hud{display:flex;justify-content:center;gap:24px;font-size:20px;font-weight:bold;margin:14px}.prompt{font-size:clamp(23px,5vw,35px);font-weight:900;background:#302d5b;border:3px solid #f9df66;border-radius:18px;max-width:850px;margin:15px auto;padding:18px}#field{position:relative;overflow:hidden;touch-action:none;margin:0 auto;width:min(96vw,950px);height:min(55vh,510px);min-height:340px;border:5px solid #57518a;border-radius:24px;background:radial-gradient(circle at center,#383466,#17172e)}.fruit{position:absolute;width:clamp(125px,23vw,190px);height:clamp(105px,18vw,145px);border-radius:48% 52% 47% 53%;display:flex;align-items:center;justify-content:center;padding:13px;color:#1a1626;font-size:clamp(17px,2.5vw,22px);font-weight:900;line-height:1.18;box-shadow:inset -12px -12px 0 #0002,0 12px 15px #0006;border:4px solid #fff8;user-select:none;touch-action:none;cursor:crosshair;animation:float 1.8s ease-in-out infinite alternate}.fruit:nth-child(2){animation-delay:-.4s}.fruit:nth-child(3){animation-delay:-.8s}.fruit:nth-child(4){animation-delay:-1.2s}@keyframes float{to{transform:translateY(-17px) rotate(4deg)}}.feedback{min-height:38px;font-size:24px;font-weight:900;margin:12px}#results{max-width:850px;margin:15px auto;padding:20px;border-radius:18px;background:#302d5b;display:none;text-align:left}#results h2{text-align:center}#results li{padding:5px}footer{padding:18px;color:#bbb}#field:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(transparent 95%,#ffffff08 95%);background-size:100% 45px}@media(max-width:550px){.fruit{width:42%;height:110px}.hud{gap:12px;font-size:16px}}</style></head><body><header><strong>🍉 FRUIT NINJA · INDICES</strong><a href="./">← Vocabulary Studio</a></header><h1>CHAPTER 1 · WORD SLASH</h1><p class="info">看中文题目，切中正确的英文词汇 · Tap or swipe the correct fruit</p><div class="setup"><label>Name <input id="student" placeholder="Student name" style="width:175px"></label><label>Questions <select id="amount"><option value="10">10</option><option value="20" selected>20</option><option value="all">All</option></select></label><button id="start">▶ START</button><button id="sound">🔊 Sound ON</button></div><div class="hud"><span id="progress">0 / 20</span><span id="score">Score: 0</span><span id="streak">Combo: 0</span></div><div class="prompt" id="prompt">Press START to play!</div><div id="field"></div><div class="feedback" id="feedback"></div><div id="results"></div><footer>English pronunciation uses browser speech synthesis; en-GB preferred.</footer><script>
const words=[["Index / Indices","指数"],["Base","底数"],["Power","幂／次方"],["Index notation","指数记法"],["Repeated multiplication","重复乘法"],["Laws of indices","指数定律"],["Positive index","正指数"],["Negative index","负指数"],["Zero index","零指数"],["Fractional index","分数指数"],["Reciprocal","倒数"],["Square root","平方根"],["Cube root","立方根"],["Same base","相同底数"],["Equivalent expressions","等值算式"],["Express in index notation.","用指数记法表示。"],["Express as a single power.","表示为单一幂。"],["Express with positive indices.","用正指数表示。"],["State the base and index.","写出底数和指数。"],["Simplify using the laws of indices.","运用指数定律化简。"]];
const $=id=>document.getElementById(id);let list=[],i=0,score=0,combo=0,wrong=[],muted=false,locked=false,active=new Set();const palette=["#ff7596","#ffe27b","#87d9ff","#8de8a4"];function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function speak(t){if(muted||!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;u.volume=1;let v=speechSynthesis.getVoices().find(x=>x.lang==="en-GB");if(v)u.voice=v;speechSynthesis.speak(u)}function beep(ok){if(muted)return;try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:210;g.gain.setValueAtTime(.22,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);o.start();o.stop(c.currentTime+.22)}catch(e){}}function begin(){let n=$("amount").value;list=shuffle(words).slice(0,n==="all"?words.length:Number(n));i=0;score=0;combo=0;wrong=[];$("results").style.display="none";$("feedback").textContent="";show()}function show(){locked=false;active.clear();$("progress").textContent=(i+1)+" / "+list.length;$("score").textContent="Score: "+score;$("streak").textContent="Combo: "+combo;if(i>=list.length){finish();return}let target=list[i];$("prompt").textContent="切出英文： "+target[1];let distract=shuffle(words.filter(w=>w[0]!==target[0])).slice(0,3);let choices=shuffle([target,...distract]);$("field").replaceChildren();let width=$("field").clientWidth,height=$("field").clientHeight;choices.forEach((w,k)=>{let f=document.createElement("div");f.className="fruit";f.textContent=w[0];f.style.background=palette[k];let col=k%2,row=Math.floor(k/2);f.style.left=(col?width*.53:width*.04)+"px";f.style.top=(row?height*.55:height*.08)+"px";f.style.maxWidth=(width*.42)+"px";f.dataset.word=w[0];f.addEventListener("pointerdown",e=>{e.preventDefault();choose(w[0],f)});$("field").append(f)})}function choose(word,f){if(locked)return;locked=true;let ok=word===list[i][0];if(ok){score++;combo++;$("feedback").textContent="✓ PERFECT SLASH!";$("feedback").style.color="#8dffb4";speak(word)}else{combo=0;wrong.push({question:list[i][1],selected:word,correct:list[i][0]});$("feedback").textContent="✕ Correct: "+list[i][0];$("feedback").style.color="#ff9c9c";speak(list[i][0])}beep(ok);f.style.opacity=".2";i++;setTimeout(show,950)}function finish(){$("field").replaceChildren();$("prompt").textContent="GAME COMPLETE!";$("progress").textContent=list.length+" / "+list.length;let pct=Math.round(score/list.length*100);let box=$("results");box.style.display="block";box.replaceChildren();let h=document.createElement("h2");h.textContent="🏆 "+score+" / "+list.length+" ("+pct+"%)";box.append(h);let p=document.createElement("p");p.textContent="Student: "+($("student").value.trim()||"Student")+" · Wrong answers: "+wrong.length;box.append(p);if(wrong.length){let ul=document.createElement("ol");wrong.forEach(w=>{let li=document.createElement("li");li.textContent=w.question+" → "+w.correct+" (selected: "+w.selected+")";ul.append(li)});box.append(ul)}let b=document.createElement("button");b.textContent="⬇ Download CSV Result";b.onclick=download;box.append(b)}function download(){let rows=[["Name","Score","Total","Accuracy"],[$("student").value||"Student",score,list.length,Math.round(score/list.length*100)+"%"],[],["Chinese question","Correct English","Selected English"],...wrong.map(w=>[w.question,w.correct,w.selected])];let csv="\ufeff"+rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="Form3_Indices_Fruit_Ninja_Result.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}$("start").onclick=begin;$("sound").onclick=()=>{muted=!muted;$("sound").textContent=muted?"🔇 Sound OFF":"🔊 Sound ON"};let last=0;$("field").addEventListener("pointermove",e=>{if(e.buttons!==1||locked||Date.now()-last<120)return;last=Date.now();let el=document.elementFromPoint(e.clientX,e.clientY);if(el?.classList.contains("fruit"))choose(el.dataset.word,el)});</script></body></html>
