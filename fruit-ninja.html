<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indices · Fruit Ninja Vocabulary</title><style>*{box-sizing:border-box}body{margin:0;background:#15152b;color:white;font-family:Arial,"Microsoft YaHei",sans-serif;text-align:center}header{padding:18px;background:#242440;display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#ffe16c;font-weight:bold}h1{font-size:clamp(26px,5vw,42px);margin:18px 0 6px}.info{color:#d5d2f5}button,select,input{font:inherit;font-size:18px;border-radius:12px;padding:11px 15px;border:2px solid #fff}button{cursor:pointer;background:#ffdc55;color:#222;font-weight:bold}.setup{margin:20px auto;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}.hud{display:flex;justify-content:center;gap:24px;font-size:20px;font-weight:bold;margin:14px}.prompt{font-size:clamp(23px,5vw,35px);font-weight:900;background:#302d5b;border:3px solid #f9df66;border-radius:18px;max-width:850px;margin:15px auto;padding:18px}#field{position:relative;overflow:hidden;touch-action:none;margin:0 auto;width:min(96vw,950px);height:min(55vh,510px);min-height:340px;border:5px solid #57518a;border-radius:24px;background:radial-gradient(circle at center,#383466,#17172e)}.fruit{position:absolute;width:clamp(125px,23vw,190px);height:clamp(105px,18vw,145px);border-radius:48% 52% 47% 53%;display:flex;align-items:center;justify-content:center;padding:13px;color:#1a1626;font-size:clamp(17px,2.5vw,22px);font-weight:900;line-height:1.18;box-shadow:inset -12px -12px 0 #0002,0 12px 15px #0006;border:4px solid #fff8;user-select:none;touch-action:none;cursor:crosshair;animation:float 1.8s ease-in-out infinite alternate}.fruit:nth-child(2){animation-delay:-.4s}.fruit:nth-child(3){animation-delay:-.8s}.fruit:nth-child(4){animation-delay:-1.2s}@keyframes float{to{transform:translateY(-17px) rotate(4deg)}}.feedback{min-height:38px;font-size:24px;font-weight:900;margin:12px}#results{max-width:850px;margin:15px auto;padding:20px;border-radius:18px;background:#302d5b;display:none;text-align:left}#results h2{text-align:center}#results li{padding:5px}footer{padding:18px;color:#bbb}#field:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(transparent 95%,#ffffff08 95%);background-size:100% 45px}@media(max-width:550px){.fruit{width:42%;height:110px}.hud{gap:12px;font-size:16px}} .fruit{animation:none;will-change:transform;transition:opacity .18s}.fruit.cut{opacity:0!important;filter:brightness(2)}#trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}.spark{position:absolute;z-index:7;pointer-events:none;border-radius:50%;animation:burst .65s ease-out forwards}@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}.slash-label{position:absolute;z-index:8;pointer-events:none;color:white;font-size:30px;font-weight:900;text-shadow:0 3px 12px #000;animation:burst .8s forwards}.fruit:after{content:"";position:absolute;top:10px;left:18px;width:36%;height:17%;border-radius:50%;background:#fff6;transform:rotate(-22deg)}#field{box-shadow:inset 0 0 70px #0009,0 0 30px #ed4d7130}.hud span{background:#ffffff12;padding:9px 13px;border-radius:12px}@media(max-width:550px){.fruit{font-size:16px;padding:8px}.prompt{margin:10px;padding:12px}} </style></head><body><header><strong>🍉 FRUIT NINJA · INDICES</strong><a href="./">← Vocabulary Studio</a></header><h1>CHAPTER 1 · WORD SLASH</h1><p class="info">看中文题目，切中正确的英文词汇 · Tap or swipe the correct fruit</p><div class="setup"><label>Name <input id="student" placeholder="Student name" style="width:175px"></label><label>Questions <select id="amount"><option value="10">10</option><option value="20" selected>20</option><option value="all">All</option></select></label><button id="start">▶ START</button><button id="sound">🔊 Sound ON</button></div><div class="hud"><span id="progress">0 / 20</span><span id="score">Score: 0</span><span id="streak">Combo: 0</span></div><div class="prompt" id="prompt">Press START to play!</div><div id="field"><canvas id="trail"></canvas></div><div class="feedback" id="feedback"></div><div id="results"></div><footer>English pronunciation uses browser speech synthesis; en-GB preferred.</footer><script>
const words=[["Index / Indices","指数"],["Base","底数"],["Power","幂／次方"],["Index notation","指数记法"],["Repeated multiplication","重复乘法"],["Laws of indices","指数定律"],["Positive index","正指数"],["Negative index","负指数"],["Zero index","零指数"],["Fractional index","分数指数"],["Reciprocal","倒数"],["Square root","平方根"],["Cube root","立方根"],["Same base","相同底数"],["Equivalent expressions","等值算式"],["Express in index notation.","用指数记法表示。"],["Express as a single power.","表示为单一幂。"],["Express with positive indices.","用正指数表示。"],["State the base and index.","写出底数和指数。"],["Simplify using the laws of indices.","运用指数定律化简。"]];

const $=id=>document.getElementById(id);
let list=[],i=0,score=0,combo=0,wrong=[],muted=false,locked=true,fruits=[],raf=0,lastFrame=0,roundTimer=0,down=false,trail=[],audioCtx=null,roundId=0;
const palette=["#ff7596","#ffe27b","#87d9ff","#8de8a4"];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(t){if(muted||!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.86;u.volume=1;const v=speechSynthesis.getVoices().find(x=>/^en-GB/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function sound(ok){if(muted)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();let now=audioCtx.currentTime;for(let j=0;j<3;j++){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.setValueAtTime((ok?800:260)+(ok?j*160:-j*50),now+j*.045);o.frequency.exponentialRampToValueAtTime(ok?300:90,now+j*.045+.15);g.gain.setValueAtTime(.16,now+j*.045);g.gain.exponentialRampToValueAtTime(.001,now+j*.045+.17);o.connect(g);g.connect(audioCtx.destination);o.start(now+j*.045);o.stop(now+j*.045+.18)}}catch(e){}}
function hud(){$("progress").textContent=Math.min(i+1,list.length)+" / "+list.length;$("score").textContent="Score: "+score;$("streak").textContent="Combo: "+combo}
function begin(){if(raf)cancelAnimationFrame(raf);clearTimeout(roundTimer);let n=$("amount").value;list=shuffle(words).slice(0,n==="all"?words.length:Number(n));i=0;score=0;combo=0;wrong=[];$("results").style.display="none";$("feedback").textContent="";show()}
function clearField(){cancelAnimationFrame(raf);clearTimeout(roundTimer);fruits=[];trail=[];$("field").replaceChildren();let canvas=document.createElement("canvas");canvas.id="trail";$("field").append(canvas);resizeCanvas()}
function resizeCanvas(){let c=$("trail");if(!c)return;const rect=$("field").getBoundingClientRect();c.width=Math.round(rect.width*devicePixelRatio);c.height=Math.round(rect.height*devicePixelRatio);c.style.width=rect.width+"px";c.style.height=rect.height+"px";c.getContext("2d").setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
function show(){locked=false;roundId++;hud();if(i>=list.length){finish();return}clearField();let target=list[i];$("prompt").textContent="切出英文： "+target[1];let choices=shuffle([target,...shuffle(words.filter(w=>w[0]!==target[0])).slice(0,3)]);let w=$("field").clientWidth,h=$("field").clientHeight;const fw=Math.min(w*.42,190),fh=w<550?110:135;choices.forEach((item,k)=>{let f=document.createElement("div");f.className="fruit";f.textContent=item[0];f.style.background=palette[k];f.style.width=fw+"px";f.style.height=fh+"px";f.dataset.word=item[0];f.style.left="0";f.style.top="0";$("field").append(f);let col=k%2,row=Math.floor(k/2),x=(col? w-fw-15:15),y=(row?h-fh-24:24);fruits.push({el:f,x,y,vx:(col?-1:1)*(25+Math.random()*25),vy:(row?-1:1)*(17+Math.random()*25),width:fw,height:fh});f.addEventListener("pointerdown",e=>{e.preventDefault();sliceAt(e.clientX,e.clientY);choose(item[0],f)})});lastFrame=performance.now();raf=requestAnimationFrame(tick);let thisRound=roundId;roundTimer=setTimeout(()=>{if(!locked&&thisRound===roundId){wrong.push({question:target[1],selected:"Time out",correct:target[0]});combo=0;$("feedback").textContent="⌛ TIME OUT! "+target[0];$("feedback").style.color="#ffbd8a";sound(false);locked=true;i++;roundTimer=setTimeout(show,850)}},14000)}
function tick(t){if(locked)return;let dt=Math.min((t-lastFrame)/1000,.045);lastFrame=t;let w=$("field").clientWidth,h=$("field").clientHeight;fruits.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.x<8){f.x=8;f.vx=Math.abs(f.vx)}if(f.x>w-f.width-8){f.x=w-f.width-8;f.vx=-Math.abs(f.vx)}if(f.y<8){f.y=8;f.vy=Math.abs(f.vy)}if(f.y>h-f.height-8){f.y=h-f.height-8;f.vy=-Math.abs(f.vy)}f.el.style.transform="translate("+f.x+"px,"+f.y+"px) rotate("+Math.sin(t/650+f.x)*5+"deg)"});drawTrail(t);raf=requestAnimationFrame(tick)}
function drawTrail(t){const c=$("trail");if(!c)return;let ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);trail=trail.filter(p=>t-p.t<280);if(trail.length<2)return;ctx.lineCap="round";ctx.lineJoin="round";ctx.shadowColor="#fff0a8";ctx.shadowBlur=24;for(let j=1;j<trail.length;j++){let a=trail[j-1],b=trail[j];ctx.strokeStyle="rgba(255,255,235,"+(1-(t-b.t)/320)+")";ctx.lineWidth=5+j/trail.length*12;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
function sliceAt(cx,cy){const rect=$("field").getBoundingClientRect();trail.push({x:cx-rect.left,y:cy-rect.top,t:performance.now()});if(trail.length>18)trail.shift()}
function particles(f,ok){let rect=$("field").getBoundingClientRect(),x=f.getBoundingClientRect().left-rect.left+f.offsetWidth/2,y=f.getBoundingClientRect().top-rect.top+f.offsetHeight/2;for(let j=0;j<24;j++){let s=document.createElement("span");s.className="spark";s.style.left=x+"px";s.style.top=y+"px";s.style.width=(5+Math.random()*12)+"px";s.style.height=s.style.width;s.style.background=ok?palette[j%4]:"#ff5555";let a=Math.random()*Math.PI*2,d=45+Math.random()*130;s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");$("field").append(s);setTimeout(()=>s.remove(),700)}let label=document.createElement("span");label.className="slash-label";label.style.left=x+"px";label.style.top=y+"px";label.textContent=ok?"+"+(combo>=3?2:1)+" COMBO!":"MISS!";$("field").append(label);setTimeout(()=>label.remove(),850)}
function choose(word,f){if(locked)return;locked=true;cancelAnimationFrame(raf);clearTimeout(roundTimer);let ok=word===list[i][0];if(ok){score++;combo++;$("feedback").textContent=combo>=3?"⚡ "+combo+" HIT COMBO!":"✓ PERFECT SLASH!";$("feedback").style.color="#8dffb4";speak(word)}else{combo=0;wrong.push({question:list[i][1],selected:word,correct:list[i][0]});$("feedback").textContent="✕ Correct: "+list[i][0];$("feedback").style.color="#ff9c9c";speak(list[i][0])}sound(ok);particles(f,ok);f.classList.add("cut");if(navigator.vibrate)navigator.vibrate(ok?[35,25,45]:[110]);i++;hud();roundTimer=setTimeout(show,1050)}
function finish(){clearField();$("prompt").textContent="GAME COMPLETE!";$("progress").textContent=list.length+" / "+list.length;let pct=Math.round(score/list.length*100),box=$("results");box.style.display="block";box.replaceChildren();let h=document.createElement("h2");h.textContent="🏆 "+score+" / "+list.length+" ("+pct+"%)";box.append(h);let p=document.createElement("p");p.textContent="Student: "+($("student").value.trim()||"Student")+" · Wrong answers: "+wrong.length;box.append(p);if(wrong.length){let ul=document.createElement("ol");wrong.forEach(w=>{let li=document.createElement("li");li.textContent=w.question+" → "+w.correct+" (selected: "+w.selected+")";ul.append(li)});box.append(ul)}let b=document.createElement("button");b.textContent="⬇ Download CSV Result";b.onclick=download;box.append(b)}
function download(){let rows=[["Name","Score","Total","Accuracy"],[$("student").value||"Student",score,list.length,Math.round(score/list.length*100)+"%"],[],["Chinese question","Correct English","Selected English"],...wrong.map(w=>[w.question,w.correct,w.selected])];let csv="\ufeff"+rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="Form3_Indices_Fruit_Ninja_Result.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$("start").onclick=begin;$("sound").onclick=()=>{muted=!muted;$("sound").textContent=muted?"🔇 Sound OFF":"🔊 Sound ON"};let last=0;
$("field").addEventListener("pointerdown",e=>{down=true;try{$("field").setPointerCapture(e.pointerId)}catch(_){}sliceAt(e.clientX,e.clientY)});
$("field").addEventListener("pointerup",()=>down=false);$("field").addEventListener("pointercancel",()=>down=false);
$("field").addEventListener("pointermove",e=>{if(!down||locked)return;sliceAt(e.clientX,e.clientY);if(Date.now()-last<55)return;last=Date.now();const rect=$("field").getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;for(const f of fruits){if(x>=f.x&&x<=f.x+f.width&&y>=f.y&&y<=f.y+f.height){choose(f.el.dataset.word,f.el);break}}});
window.addEventListener("resize",()=>{if($("trail"))resizeCanvas()});
</script></body></html>
