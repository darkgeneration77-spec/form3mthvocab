const DATA=JSON.parse(document.getElementById('vocab-data').textContent);const $=id=>document.getElementById(id);let active='all',queue=[],playing=false;const synth=window.speechSynthesis;function notify(s){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>e.style.display='none',2800)}function voices(){return synth?synth.getVoices():[]}function speak(text,done){if(!synth){notify('此浏览器不支持语音播放');return}const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.86;u.pitch=1;u.volume=1;const v=voices().find(v=>/^en-GB/i.test(v.lang))||voices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.onend=()=>done&&done();u.onerror=()=>{if(done)done()};synth.speak(u)}function stop(){playing=false;queue=[];if(synth)synth.cancel()}function items(){const q=$('search').value.trim().toLowerCase();let entries=[];if(active==='all'||active==='common')entries.push(...DATA.common.map(x=>({...x,chapter:0,type:'Question words'})));for(const c of DATA.chapters){if(active!=='all'&&active!==String(c.number))continue;entries.push(...c.terms.map(x=>({...x,chapter:c.number,type:'Mathematical terms'})),...c.sentences.map(x=>({...x,chapter:c.number,type:'Question sentences'})))}return entries.filter(x=>!q||x.en.toLowerCase().includes(q)||x.zh.toLowerCase().includes(q))}function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){const list=items();$('heading').textContent=active==='all'?'All chapters':active==='common'?'Common question words':DATA.chapters.find(c=>String(c.number)===active)?.title||'';$('scope').textContent=active==='all'?'Browse every chapter and examination phrase':active==='common'?'Common English words used in mathematics questions':DATA.chapters.find(c=>String(c.number)===active)?.scope||'';$('count').textContent=list.length+' cards';$('cards').replaceChildren();if(!list.length){$('cards').append(node('div','empty','No matching vocabulary · 没有找到相关词汇'));return}list.forEach((x,i)=>{const card=node('article','card');const tag=node('div','smalltag',(x.chapter?'CH '+x.chapter:'COMMON')+' · '+x.type);const en=node('div','en',x.en),zh=node('div','zh',x.zh),act=node('div','actions'),num=node('div','index',String(i+1).padStart(2,'0')+' / '+list.length),audio=node('button','speak','🔊');audio.type='button';audio.title='Play English pronunciation';audio.setAttribute('aria-label','Pronounce '+x.en);audio.onclick=()=>{stop();speak(x.en)};zh.hidden=$('hideChinese').checked;act.append(num);card.append(tag,en,zh,act,audio);$('cards').append(card)})}function nav(){const options=[['all','ALL'],['common','QUESTION WORDS'],...DATA.chapters.map(c=>[String(c.number),'CH '+c.number])];$('chapters').replaceChildren();options.forEach(([id,label])=>{const b=node('button','chapter'+(active===id?' active':''),label);b.onclick=()=>{stop();active=id;nav();render()};$('chapters').append(b)})}function next(){if(!playing||!queue.length){playing=false;return}const x=queue.shift();speak(x.en,next)}$('playAll').onclick=()=>{stop();queue=items().slice(0,200);if(!queue.length)return;playing=true;next()};$('stop').onclick=stop;$('search').oninput=()=>{stop();render()};$('hideChinese').onchange=render;$('print').onclick=()=>window.print();window.addEventListener('beforeunload',stop);if(synth)synth.onvoiceschanged=()=>voices();nav();render();
</script></body></html>
