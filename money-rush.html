<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONEY RUSH · Form 3 Mathematics</title><style>
*{box-sizing:border-box}body{margin:0;background:#10172c;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif;font-size:18px}button,select,input{font:inherit}button{cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;background:#182344;flex-wrap:wrap}header a{color:#fff3a4;text-decoration:none;font-weight:800}main{max-width:1060px;margin:auto;padding:18px}h1{text-align:center;font-size:clamp(30px,5vw,49px);margin:8px 0}.sub{text-align:center;color:#d4e4ff}.setup,.hud{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}.setup input,.setup select,.setup button,.actions button{border:2px solid #fff;border-radius:12px;padding:10px 14px;background:#fff;color:#182344;font-weight:800}.setup button{background:#ffe263}.hud span{padding:9px 16px;background:#ffffff1c;border-radius:12px;font-weight:800}.question{padding:17px;border:3px solid #ffdc6a;background:#26355b;border-radius:18px;text-align:center;font-size:clamp(24px,4vw,35px);font-weight:900;margin:16px 0}.arena{height:440px;max-height:58vh;min-height:330px;position:relative;overflow:hidden;border:4px solid #5d74a3;border-radius:24px;background:radial-gradient(circle,#2b426a,#0a1429);touch-action:manipulation}.target{position:absolute;min-width:135px;max-width:210px;min-height:92px;padding:15px 11px;display:flex;align-items:center;justify-content:center;text-align:center;border:3px solid #fff;border-radius:26px;color:#192039;font-weight:900;line-height:1.2;font-size:clamp(16px,2.3vw,21px);box-shadow:0 8px 0 #0005;user-select:none;z-index:2;transition:filter .1s}.target:active{filter:brightness(1.3)}.target.hit{animation:explode .5s forwards}@keyframes explode{to{opacity:0;transform:scale(1.9) rotate(30deg);filter:brightness(3)}}.laser{position:absolute;z-index:5;width:8px;height:0;border-radius:8px;background:#a7ffff;box-shadow:0 0 15px #00f5ff,0 0 40px #00f5ff;transform-origin:bottom;pointer-events:none;animation:zap .32s forwards}@keyframes zap{35%{height:190px;opacity:1}to{height:210px;opacity:0}}.coin{position:absolute;pointer-events:none;z-index:8;color:#ffeb66;font-weight:900;font-size:30px;animation:coin .9s forwards}@keyframes coin{to{transform:translateY(-110px) scale(1.6);opacity:0}}.city{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:end;min-height:65px;margin:8px auto}.building{font-size:37px;animation:pop .4s ease-out}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}.feedback{text-align:center;min-height:36px;font-size:24px;font-weight:900;margin:12px}.result{display:none;background:#27395f;padding:24px;border-radius:18px}.result h2{text-align:center}.result li{margin:9px 0}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.spark{position:absolute;z-index:9;pointer-events:none;width:12px;height:12px;border-radius:50%;animation:spark .7s forwards}@keyframes spark{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}.timer{height:8px;border-radius:20px;background:#ffffff30;overflow:hidden}.timer>div{height:100%;width:100%;background:#ffdc6a;transition:width .12s linear}@media(max-width:620px){main{padding:10px}.arena{height:390px}.target{min-width:110px;max-width:46%;min-height:90px;padding:9px;font-size:16px}.setup{font-size:16px}header{font-size:15px}}
</style></head><body><header><strong>💰 MONEY RUSH</strong><a href="./">← 返回词汇学习</a></header><main><h1>MONEY RUSH</h1><p class="sub">CHAPTER 3 · Consumer Mathematics 消费数学 · 学习后挑战英文数学词汇</p><div class="setup"><label>姓名 <input id="student" placeholder="Student" style="width:150px"></label><label>题数 <select id="amount"><option value="10">10</option><option value="20" selected>20</option><option value="all">全部</option></select></label><button id="start">▶ START</button><button id="sound">🔊 ON</button></div><div class="hud"><span id="progress">0 / 20</span><span id="score">Score: 0</span><span id="combo">Combo: 0</span></div><div class="question" id="prompt">点击 START 开始</div><div class="timer"><div id="timebar"></div></div><div class="arena" id="arena"></div><div class="feedback" id="feedback"></div><div class="city" id="city"></div><section class="result" id="result"></section></main><script>const CH=3,WORDS=[{"en":"Savings","zh":"储蓄"},{"en":"Investment","zh":"投资"},{"en":"Principal","zh":"本金"},{"en":"Interest","zh":"利息"},{"en":"Simple interest","zh":"单利"},{"en":"Compound interest","zh":"复利"},{"en":"Interest rate","zh":"利率"},{"en":"Annual interest","zh":"年利息"},{"en":"Maturity value","zh":"到期价值"},{"en":"Return on investment","zh":"投资回报"},{"en":"Dividend","zh":"股息"},{"en":"Risk","zh":"风险"},{"en":"Liquidity","zh":"流动性"},{"en":"Credit","zh":"信贷"},{"en":"Debt","zh":"债务"},{"en":"Loan","zh":"贷款"},{"en":"Repayment","zh":"还款"},{"en":"Instalment","zh":"分期付款"},{"en":"Outstanding balance","zh":"未偿还余额"},{"en":"Credit card","zh":"信用卡"},{"en":"Finance charge","zh":"财务费用"},{"en":"Minimum payment","zh":"最低还款额"},{"en":"Cash rebate","zh":"现金回扣"},{"en":"Annual fee","zh":"年费"},{"en":"Effective interest rate","zh":"实际利率"},{"en":"Calculate the total interest earned.","zh":"计算赚取的总利息。"},{"en":"Determine the maturity value.","zh":"求出到期价值。"},{"en":"Compare the investment options.","zh":"比较投资选择。"},{"en":"Calculate the monthly instalment.","zh":"计算每月分期付款额。"},{"en":"Determine the outstanding balance.","zh":"求出尚欠余额。"}],MODE="money";</script><script>
const $=id=>document.getElementById(id);let questions=[],idx=0,score=0,combo=0,wrong=[],muted=false,locked=true,round=0,animation=0,deadline=0,items=[],ctx=null;
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function speech(s){if(muted||!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang="en-GB";u.rate=.86;u.volume=1;let v=speechSynthesis.getVoices().find(x=>x.lang==="en-GB");if(v)u.voice=v;speechSynthesis.speak(u)}
function beep(ok){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.setValueAtTime(ok?750:200,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(ok?1100:90,ctx.currentTime+.2);g.gain.setValueAtTime(.19,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.25);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.26)}catch(e){}}
function begin(){cancelAnimationFrame(animation);round++;let n=$("amount").value;questions=shuffle(WORDS).slice(0,n==="all"?WORDS.length:Number(n));idx=0;score=0;combo=0;wrong=[];$("city").replaceChildren();$("result").style.display="none";$("feedback").textContent="";show()}
function hud(){$("progress").textContent=Math.min(idx+1,questions.length)+" / "+questions.length;$("score").textContent=(MODE==="money"?"Coins: ":"Score: ")+score;$("combo").textContent="Combo: "+combo}
function show(){cancelAnimationFrame(animation);round++;if(idx>=questions.length){finish();return}locked=false;hud();$("arena").replaceChildren();let q=questions[idx];$("prompt").textContent=(MODE==="space"?"🚀 击中英文： ":MODE==="money"?"💰 找出正确金融词汇： ":"🏗️ 选择正确建筑指令： ")+q.zh;let options=shuffle([q,...shuffle(WORDS.filter(w=>w.en!==q.en)).slice(0,3)]);let w=$("arena").clientWidth,h=$("arena").clientHeight;items=[];options.forEach((o,k)=>{let b=document.createElement("button");b.className="target";b.textContent=(MODE==="space"?"☄️ ":MODE==="money"?"🪙 ":"📐 ")+o.en;b.style.background=["#ffbd74","#a5e7ff","#f9a6d2","#b5f5b3"][k];$("arena").append(b);let bw=b.offsetWidth,bh=b.offsetHeight;let col=k%2,row=Math.floor(k/2);let x=col?(w-bw-14):14,y=row?(h-bh-20):20;items.push({el:b,x,y,vx:(col?-1:1)*(MODE==="space"?60:MODE==="money"?35:20),vy:(row?-1:1)*(MODE==="space"?38:MODE==="money"?22:14),w:bw,h:bh});b.onclick=()=>choose(o,b)});deadline=performance.now()+(MODE==="space"?12000:MODE==="money"?15000:18000);let r=round;let last=performance.now();function tick(t){if(locked||round!==r)return;let dt=Math.min((t-last)/1000,.05);last=t;items.forEach(v=>{v.x+=v.vx*dt;v.y+=v.vy*dt;if(v.x<4||v.x>w-v.w-4)v.vx*=-1;if(v.y<4||v.y>h-v.h-4)v.vy*=-1;v.x=Math.max(4,Math.min(w-v.w-4,v.x));v.y=Math.max(4,Math.min(h-v.h-4,v.y));v.el.style.transform="translate("+v.x+"px,"+v.y+"px)"});$("timebar").style.width=Math.max(0,(deadline-t)/(MODE==="space"?120:MODE==="money"?150:180))+"%";if(t>=deadline){locked=true;wrong.push({zh:q.zh,en:q.en,selected:"Time out"});combo=0;$("feedback").textContent="⌛ TIME OUT · "+q.en;beep(false);idx++;setTimeout(show,850);return}animation=requestAnimationFrame(tick)}animation=requestAnimationFrame(tick)}
function fx(el,ok){let r=$("arena").getBoundingClientRect(),e=el.getBoundingClientRect(),x=e.left-r.left+e.width/2,y=e.top-r.top+e.height/2;for(let i=0;i<19;i++){let s=document.createElement("span");s.className="spark";s.style.left=x+"px";s.style.top=y+"px";s.style.background=ok?["#fff","#ffdc65","#5efbff"][i%3]:"#ff5577";let a=Math.random()*Math.PI*2,d=35+Math.random()*100;s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");$("arena").append(s);setTimeout(()=>s.remove(),720)}if(MODE==="space"){let l=document.createElement("div");l.className="laser";l.style.left=x+"px";l.style.top=(y+90)+"px";$("arena").append(l);setTimeout(()=>l.remove(),400)}if(MODE==="money"){let c=document.createElement("div");c.className="coin";c.textContent=ok?"+10 🪙":"−5";c.style.left=x+"px";c.style.top=y+"px";$("arena").append(c);setTimeout(()=>c.remove(),950)}if(MODE==="city"&&ok){let b=document.createElement("span");b.className="building";b.textContent=["🏠","🏢","🏫","🏬","🏰","🌳","🏭"][score%7];$("city").append(b)}el.classList.add("hit")}
function choose(o,el){if(locked)return;locked=true;cancelAnimationFrame(animation);let q=questions[idx],ok=o.en===q.en;if(ok){score+=MODE==="money"?10:1;combo++;$("feedback").textContent=combo>=3?"⚡ COMBO × "+combo:"✓ CORRECT!";$("feedback").style.color="#8fffb7";speech(q.en)}else{if(MODE==="money")score=Math.max(0,score-5);combo=0;wrong.push({zh:q.zh,en:q.en,selected:o.en});$("feedback").textContent="✕ "+q.en;$("feedback").style.color="#ff9e9e";speech(q.en)}beep(ok);fx(el,ok);if(navigator.vibrate)navigator.vibrate(ok?40:110);idx++;hud();setTimeout(show,950)}
function finish(){cancelAnimationFrame(animation);locked=true;$("arena").replaceChildren();$("prompt").textContent="CHALLENGE COMPLETE!";$("timebar").style.width="0%";$("progress").textContent=questions.length+" / "+questions.length;let correct=questions.length-wrong.length,pct=Math.round(correct/questions.length*100),box=$("result");box.style.display="block";box.replaceChildren();let h=document.createElement("h2");h.textContent="🏆 "+correct+" / "+questions.length+" · "+pct+"%";box.append(h);let p=document.createElement("p");p.textContent="Student: "+($("student").value.trim()||"Student")+" · "+(MODE==="money"?"Coins: "+score+" · ":"")+"错题: "+wrong.length;box.append(p);if(wrong.length){let ul=document.createElement("ol");wrong.forEach(w=>{let li=document.createElement("li");li.textContent=w.zh+" → "+w.en+" (选择: "+w.selected+")";ul.append(li)});box.append(ul)}let actions=document.createElement("div");actions.className="actions";let b=document.createElement("button");b.textContent="⬇ 下载 CSV 成绩";b.onclick=download;let retry=document.createElement("button");retry.textContent="↻ 再玩一次";retry.onclick=begin;actions.append(b,retry);box.append(actions)}
function download(){let rows=[["Name","Chapter","Game","Correct","Total","Accuracy","Points"],[$("student").value.trim()||"Student",CH,MODE,questions.length-wrong.length,questions.length,Math.round((questions.length-wrong.length)/questions.length*100)+"%",score],[],["Chinese","Correct English","Selected English"],...wrong.map(w=>[w.zh,w.en,w.selected])];let csv="﻿"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("
");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="Form3_Math_Chapter"+CH+"_Result.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$("start").onclick=begin;$("sound").onclick=()=>{muted=!muted;$("sound").textContent=muted?"🔇 OFF":"🔊 ON"};
</script></body></html>
